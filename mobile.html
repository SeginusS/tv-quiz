<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Controller</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; margin: 0; }
    input, button { width: 90%; max-width: 320px; padding: 16px; margin: 10px 0; font-size: 1.2rem; border-radius: 12px; border: none; box-sizing: border-box; }
    input { background: #1e293b; color: white; border: 1px solid #475569; }
    .btn-main { background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; height: 40vh; }
    .ans-btn { font-size: 2.5rem; font-weight: bold; color: white; border-radius: 16px; width: 100%; height: 100%; border: none; cursor: pointer; }
    .red { background: #ef4444; } .blue { background: #3b82f6; }
    .yellow { background: #f59e0b; } .green { background: #10b981; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="joinSection">
    <h2>🎮 Είσοδος στο Παιχνίδι</h2>
    <input type="text" id="playerName" placeholder="Το όνομά σου">
    <input type="number" id="roomInput" placeholder="4-ψήφιος Κωδικός">
    <br>
    <button class="btn-main" onclick="joinGame()">Σύνδεση</button>
  </div>

  <div id="controllerSection" class="hidden">
    <h3 id="welcomeMsg"></h3>
    
    <div id="hostControls" class="hidden" style="margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <button id="actionBtn" class="btn-main" style="background: #059669; width: 90%; max-width: 320px;" onclick="startGame()">🚀 Έναρξη Παιχνιδιού</button>
      <div style="display: flex; gap: 8px; width: 90%; max-width: 320px;">
        <button class="btn-main" style="background: #d97706; flex: 1; padding: 12px; font-size: 1rem;" onclick="pauseGame()">⏸️ Παύση</button>
        <button class="btn-main" style="background: #2563eb; flex: 1; padding: 12px; font-size: 1rem;" onclick="resumeGame()">▶️ Συνέχιση</button>
      </div>
      <button class="btn-main" style="background: #dc2626; width: 90%; max-width: 320px; padding: 12px; font-size: 1rem;" onclick="terminateGame()">🛑 Τερματισμός</button>
    </div>

    <p id="statusMsg">Περιμένετε την έναρξη...</p>
    
    <div id="buttonsGrid" class="grid hidden">
      <button class="ans-btn red" onclick="sendAnswer('A')">A</button>
      <button class="ans-btn blue" onclick="sendAnswer('B')">B</button>
      <button class="ans-btn yellow" onclick="sendAnswer('C')">C</button>
      <button class="ans-btn green" onclick="sendAnswer('D')">D</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentRoom = '';
    let hasAnswered = false;

    window.onload = function() {
      const savedName = localStorage.getItem('quiz_player_name');
      const savedRoom = localStorage.getItem('quiz_room_id');
      if (savedName && savedRoom) {
        currentRoom = savedRoom;
        socket.emit('join-room', { roomId: savedRoom, playerName: savedName });
      }
    };

    function joinGame() {
      const name = document.getElementById('playerName').value.trim();
      const room = document.getElementById('roomInput').value.trim();

      if (name && room) {
        currentRoom = room;
        localStorage.setItem('quiz_player_name', name);
        localStorage.setItem('quiz_room_id', room);
        socket.emit('join-room', { roomId: room, playerName: name });
      }
    }

    socket.on('joined-successfully', (data) => {
      document.getElementById('joinSection').classList.add('hidden');
      document.getElementById('controllerSection').classList.remove('hidden');
      document.getElementById('welcomeMsg').textContent = `Παίζεις ως: ${data.playerName}`;

      const hostControls = document.getElementById('hostControls');
      if (data.isHost) {
        hostControls.style.display = 'flex';
        document.getElementById('statusMsg').textContent = 'Εσείς είστε ο Διαχειριστής!';
      } else {
        hostControls.style.display = 'none';
        document.getElementById('statusMsg').textContent = 'Περιμένετε τον διαχειριστή να ξεκινήσει το παιχνίδι...';
      }
    });

    socket.on('error-message', (msg) => alert(msg));

    function startGame() {
      socket.emit('start-game', currentRoom);
    }

    function pauseGame() {
      socket.emit('pause-game', currentRoom);
    }

    function resumeGame() {
      socket.emit('resume-game', currentRoom);
    }

    function terminateGame() {
      socket.emit('terminate-game', currentRoom);
    }

    socket.on('show-question', () => {
      hasAnswered = false;
      document.getElementById('statusMsg').textContent = 'Επιλέξτε απάντηση!';
      document.getElementById('buttonsGrid').classList.remove('hidden');
    });

    function sendAnswer(ans) {
      if (hasAnswered) return;
      hasAnswered = true;
      
      socket.emit('submit-answer', { roomId: currentRoom, answer: ans });
      document.getElementById('statusMsg').textContent = `Η απάντησή σας (${ans}) κλειδώθηκε! 🤫`;
      document.getElementById('buttonsGrid').classList.add('hidden');
    }

    // ΟΤΑΝ ΜΠΑΙΝΕΙ ΣΕ ΠΑΥΣΗ, ΚΡΥΒΟΝΤΑΙ ΤΑ ΚΟΥΜΠΙΑ ΑΠΑΝΤΗΣΗΣ ΚΑΙ ΔΕΙΧΝΕΙ ΜΗΝΥΜΑ
    socket.on('game-paused', () => {
      document.getElementById('buttonsGrid').classList.add('hidden');
      document.getElementById('statusMsg').textContent = '⏸️ ΤΟ ΠΑΙΧΝΙΔΙ ΕΙΣΕΛΘΕ ΣΕ ΠΑΥΣΗ';
    });

    socket.on('game-resumed', () => {
      if (!hasAnswered) {
        document.getElementById('buttonsGrid').classList.remove('hidden');
      }
      document.getElementById('statusMsg').textContent = '▶️ Το παιχνίδι συνεχίζεται κανονικά!';
    });

    socket.on('game-terminated', () => {
      document.getElementById('buttonsGrid').classList.add('hidden');
      document.getElementById('statusMsg').textContent = '🛑 Ο διαχειριστής τερμάτισε το παιχνίδι.';
      const actionBtn = document.getElementById('actionBtn');
      if (actionBtn) actionBtn.textContent = '🚀 Έναρξη Παιχνιδιού';
    });

    socket.on('reveal-answer', () => {
      document.getElementById('buttonsGrid').classList.add('hidden');
      document.getElementById('statusMsg').textContent = 'Ο χρόνος έληξε! Δείτε τα αποτελέσματα στην τηλεόραση.';
    });

    socket.on('game-over', () => {
      document.getElementById('buttonsGrid').classList.add('hidden');
      document.getElementById('statusMsg').textContent = '🏆 Το παιχνίδι τελείωσε!';
      
      const actionBtn = document.getElementById('actionBtn');
      if (actionBtn) actionBtn.textContent = '🔄 Παίξε Ξανά';
    });
  </script>
</body>
</html>
